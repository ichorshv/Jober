spring.application.name=Jober

# Local PostgreSQL (see compose.yaml). Override with env vars if needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/jobtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# schema.sql (drop + create + seed) runs on every start; Hibernate only validates.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Password given to seed accounts whose password_hash is 'CHANGE_ME'.
app.seed.default-password=password123
